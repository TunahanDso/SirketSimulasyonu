[package]
name = "tunix"
version = "0.4.0"
edition = "2024"

[dependencies]
rust_decimal = { version = "1.42", features = ["serde", "serde-arbitrary-precision", "serde-with-arbitrary-precision"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
